name: Compilar APK de TODO PARA EL COMPRADOR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  compilar:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Subir el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: APK-TODO-PARA-EL-COMPRADOR
          path: app/build/outputs/apk/debug/app-debug.apk
